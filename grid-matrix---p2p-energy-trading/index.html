<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Matrix | Decentralized Energy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-lime: #9FDC56;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #161815;
            color: #EAFFD2;
            margin: 0;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        h1, h2, h3, h4, h5, h6, .font-serif {
            font-family: 'Playfair Display', serif;
        }

        /* Sharper Grid Background */
        .bg-grid {
            background-size: 60px 60px;
            background-image:
                linear-gradient(to right, rgba(234, 255, 210, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(234, 255, 210, 0.04) 1px, transparent 1px);
        }

        .arc-glow {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 1200px;
            height: 600px;
            background: radial-gradient(ellipse at bottom, rgba(159, 220, 86, 0.12) 0%, rgba(159, 220, 86, 0.02) 50%, rgba(0, 0, 0, 0) 80%);
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
        }

        .arc-line {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translateX(-50%);
            width: 800px;
            height: 400px;
            border-top: 2px solid rgba(255, 95, 31, 0.3);
            border-radius: 50% 50% 0 0;
            z-index: 1;
            mask-image: linear-gradient(to right, transparent, black 20%, black 80%, transparent);
        }

        @keyframes scan {
            0% {
                transform: translateY(-100%);
                opacity: 0;
            }

            50% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(100%);
                opacity: 0;
            }
        }

        .scan-line-v {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(255, 95, 31, 0.4), transparent);
            animation: scan 3s linear infinite;
        }

        .glass {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #FF5F1F;
        }

        .text-outline {
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
            color: transparent;
        }

        /* Text shadow for readability over video */
        h1,
        h2,
        h3,
        h4,
        p,
        span,
        a,
        button,
        li {
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7), 0 0px 20px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>

<body class="bg-grid">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
